name: PR-4 Intraday Dashboard (offline)
on:
  push:
    branches: [feat/shioaji-observation-dashboard-pr4]
  pull_request:
    paths:
      - "src/application/services/intraday_dashboard.py"
      - "src/web/server.py"
      - "src/web/templates/intraday.html"
      - "tests/unit/test_intraday_dashboard.py"
      - "tests/unit/test_intraday_web_routes.py"
      - ".github/workflows/intraday-dashboard-pr4.yml"
permissions:
  contents: read
jobs:
  dashboard-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated dependencies
        run: python -m pip install pytest fastapi "httpx>=0.27" jinja2 python-multipart pydantic pyyaml exchange-calendars requests python-dotenv pytz
      - name: Compile dashboard modules
        run: python -m compileall -q src/application/services/intraday_dashboard.py scripts/build_intraday_dashboard.py src/web/server.py tests/unit/test_intraday_dashboard.py tests/unit/test_intraday_web_routes.py
      - name: Verify offline feed and API routes
        run: python -m pytest tests/unit/test_intraday_dashboard.py tests/unit/test_intraday_web_routes.py -q
      - name: Recheck PR-1 to PR-3 offline regressions
        run: python -m pytest tests/unit/test_intraday_tick_collector.py tests/unit/test_intraday_book.py tests/unit/test_intraday_forward_evaluation.py -q
