name: PR-1 Intraday Tick (offline)

on:
  pull_request:
    paths:
      - "src/market_data/intraday_*.py"
      - "src/cli/intraday.py"
      - "src/cli/main.py"
      - "tests/unit/test_intraday_tick_collector.py"
      - "tests/unit/test_intraday_reliability.py"
      - ".github/workflows/intraday-tick-pr1.yml"
  push:
    branches:
      - "feat/shioaji-tick-collector-pr1"

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install pytest
      - name: Compile changed Python files
        run: python -m compileall -q src/market_data/intraday_tick.py src/market_data/intraday_collector.py src/cli/intraday.py src/cli/main.py tests/unit/test_intraday_tick_collector.py
      - name: Isolated offline tests (no broker login, no keys)
        run: python -m pytest tests/unit/test_intraday_tick_collector.py tests/unit/test_intraday_reliability.py -q
