name: PR-3 Intraday Forward Study (offline)
on:
  push:
    branches: [feat/shioaji-forward-evaluation-pr3]
  pull_request:
    paths:
      - "src/application/research/intraday_evaluation.py"
      - "scripts/intraday_forward_eval.py"
      - "tests/unit/test_intraday_forward_evaluation.py"
      - "src/market_data/intraday_*.py"
      - "src/cli/intraday*.py"
      - "src/cli/main.py"
      - ".github/workflows/intraday-forward-pr3.yml"
permissions:
  contents: read
jobs:
  research-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install pytest
      - name: Compile forward research + latest upstream market data modules
        run: python -m compileall -q src/application/research/intraday_evaluation.py scripts/intraday_forward_eval.py src/market_data/intraday_tick.py src/market_data/intraday_book.py src/market_data/intraday_collector.py src/market_data/intraday_connection.py src/market_data/intraday_storage.py src/market_data/intraday_audit.py src/market_data/intraday_observations.py src/cli/intraday.py src/cli/intraday_book.py
      - name: Offline study CLI import smoke
        run: python -m scripts.intraday_forward_eval --help
      - name: Full PR1/PR2 P0-P1 regressions + PR3 offline study (no broker keys)
        run: python -m pytest tests/unit/test_intraday_forward_evaluation.py tests/unit/test_intraday_tick_collector.py tests/unit/test_intraday_book.py tests/unit/test_intraday_reliability.py tests/unit/test_intraday_2327_preflight.py tests/unit/test_intraday_p0_p1.py -q
