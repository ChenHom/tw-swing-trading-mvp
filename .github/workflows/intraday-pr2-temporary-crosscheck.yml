name: Temporary PR-2 cross-branch offline verification
on:
  push:
    branches:
      - feat/shioaji-tick-collector-pr1
permissions:
  contents: read
jobs:
  bidask-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/shioaji-bidask-observations-pr2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install pytest
      - run: git rev-parse HEAD
      - name: Compile PR-2 changed modules
        run: python -m compileall -q src/market_data/intraday_tick.py src/market_data/intraday_book.py src/market_data/intraday_collector.py src/market_data/intraday_connection.py src/market_data/intraday_storage.py src/cli/intraday.py src/cli/intraday_book.py
      - name: PR-1 and PR-2 synthetic regressions (no credentials)
        run: python -m pytest tests/unit/test_intraday_tick_collector.py tests/unit/test_intraday_reliability.py tests/unit/test_intraday_book.py -q
