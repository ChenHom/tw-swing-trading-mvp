name: PR-2 BidAsk Observations (offline)

on:
  pull_request:
    paths:
      - "src/market_data/intraday_*.py"
      - "src/cli/intraday*.py"
      - "src/cli/main.py"
      - "tests/unit/test_intraday_book.py"
      - "tests/unit/test_intraday_tick_collector.py"
      - "tests/unit/test_intraday_reliability.py"
      - "tests/unit/test_intraday_2327_preflight.py"
      - "docs/operations/shioaji-2327-live-smoke-checklist.md"
      - ".github/workflows/intraday-book-pr2.yml"
  push:
    branches:
      - "feat/shioaji-bidask-observations-pr2"

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install pytest
      - name: Compile Python modules
        run: python -m compileall -q src/market_data/intraday_tick.py src/market_data/intraday_book.py src/market_data/intraday_storage.py src/market_data/intraday_connection.py src/market_data/intraday_collector.py src/market_data/intraday_observations.py src/cli/intraday.py src/cli/intraday_book.py src/cli/main.py tests/unit/test_intraday_2327_preflight.py
      - name: Run PR-1 regression and PR-2 offline tests
        run: python -m pytest tests/unit/test_intraday_tick_collector.py tests/unit/test_intraday_book.py tests/unit/test_intraday_reliability.py tests/unit/test_intraday_2327_preflight.py -q
