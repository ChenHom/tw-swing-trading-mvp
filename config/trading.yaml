database_path: "data/app.db"
approval:
  expiry_warning_sessions: 3
  allowlist_path: "config/issuer-allowlist.json"
  revoked_path: "config/revoked-approvals.json"
  active_pointer_path: "artifacts/approvals/active-approval.json"   # legacy 單一 pointer（向下相容回讀）
  active_map_path: "artifacts/approvals/active-approvals.json"      # 多策略 active map（strategy_id -> approval_id）
  approvals_dir: "artifacts/approvals/"

# 每日訊號管線固定順序（risk_exit 一律最先執行，再依此清單跑進場策略）
pipeline:
  entry_strategies:
    - trend_breakout
    - pullback_rebound
  index_symbol: "TSE"
  # Per-account 進場策略 override（PIT 公平裁決後的治理，2026-06-24）：
  # pullback_rebound 已 PIT REJECTED → 從真實帳號（國泰）退役、不再產生新 BUY 建議；
  # trend_breakout（唯一 RESEARCH_PASS）續留。simulation-main（影子）未列入＝回退全域
  # 兩支，繼續 forward 觀察 pullback。既有持倉不受影響：risk_exit 全策略載入、照常出場。
  account_overrides:
    國泰:
      - trend_breakout
  # Per-account 選股宇宙 override（account_id -> universe_policy.policy_version）：
  # 影子帳號（simulation-main）改吃 PIT 流動性 top-150 廣度池，讓進場策略在約 150 檔
  # 趨勢股裡選，而非固定 24 檔；真實帳號（國泰）未列入＝維持固定 universe.yaml 清單。
  # 安全退回：app.db 尚無此 policy 成分（資料未回補）時，自動退回固定清單並印警告。
  # 上線需先把 top-150 的 Shioaji 日線回補進 app.db 並建 policy（見 market build-universe）。
  universe_overrides:
    simulation-main: "liquidity-top150-v1"
  # 列名帳號的 per-strategy + global 持倉數上限(max_open_positions)視為無上限;
  # 每日買入額度(per-strategy 150k / global 200k)不受影響、仍是最終防線。
  # 影子帳號接廣度池後放開持倉數,才能真正持有更多部位觀測。
  unlimited_positions_accounts:
    - simulation-main
  # 現金閒置根治(2026-07)：sim 帳號現金持續累積但每筆倉位固定 20000、每天只開 2 個新倉，
  # 現金長不進部位。以下兩個 per-account 覆寫只套用在列名帳號，國泰不受影響。
  max_new_positions_per_day_overrides:
    simulation-main: 6
  dynamic_order_sizing_accounts:
    simulation-main: 0.10

# 全局帳戶風控（per-strategy 限額由各策略 manifest 定義）
global_limits:
  max_open_positions: 8
  max_daily_buy_value: 200000
  max_new_positions_per_day: 2
