strategy_id: breakout_shadow_filter
strategy_version: 1.0.0

# 研究 Challenger（thesis：docs/strategies/breakout_shadow_filter.md），不在任何帳號的 entry_strategies。
# 進場＝trend_breakout 1.0.0 全部參數逐字相同 + 影線濾網；出場與 trend_breakout 逐字相同。
parameters:
  breakout_lookback_days: 20
  volume_avg_days: 20
  volume_multiple_pct: 150
  ma_trend_period: 60
  index_ma_period: 60
  order_budget_twd: 20000
  shadow_window_days: 7           # 近 7 日（含訊號日）上影線總和 > 下影線總和 → 不進場；N=7 照抄原貼文，不調

exit:
  fixed_stop_loss_bps: 700
  trailing_stop_bps: 800
  ma_break_period: 20
  ma_break_buffer_bps: 0
  ma_break_confirm_days: 2
  time_stop_days: 20
  time_stop_min_return_bps: 500
