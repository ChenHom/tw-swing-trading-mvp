strategy_id: trend_breakout
strategy_version: 1.0.0

parameters:
  breakout_lookback_days: 20    # 收盤創 20 日新高
  volume_avg_days: 20           # 量能均值期數
  volume_multiple_pct: 150      # 當日量 > 20 日均量 1.5 倍
  ma_trend_period: 60           # 個股多頭：close > sma_60
  index_ma_period: 60           # 大盤多頭：index_close > index_sma_60
  order_budget_twd: 20000

exit:
  fixed_stop_loss_bps: 700        # 固定停損 -7%（以 position 加權均價計）
  trailing_stop_bps: 800          # 自持有後最高收盤價回落 8%
  ma_break_period: 20             # 均線失效：收盤跌破 20 日均線
  ma_break_buffer_bps: 0
  ma_break_confirm_days: 2        # 連續 2 日收盤跌破才觸發（防單日洗盤）
  time_stop_days: 20              # 時間停損：持有 20 個交易日
  time_stop_min_return_bps: 500   # 累計報酬未達 +5% 則出場
