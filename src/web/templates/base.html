<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}tw-day-trading 儀表板{% endblock %}</title>
  <link rel="stylesheet" href="{{ base }}/static/style.css?v={{ static_v }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a href="{{ base }}/" class="brand">
      <svg class="brand-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" style="vertical-align: -0.15em; margin-right: 0.3rem; display: inline-block; color: #2b6cb0;"><path d="m3 17 6-6 4 4 8-8"/><path d="M17 7h4v4"/></svg>
      <span class="brand-text-desktop">tw-day-trading</span>
      <span class="brand-text-mobile">trading</span>
    </a>
    <nav>
      <a href="{{ base }}/">
        <span class="nav-text-desktop">儀表板</span>
        <span class="nav-text-mobile">看板</span>
      </a>
      <a href="{{ base }}/reports">
        <span class="nav-text-desktop">歷史報告</span>
        <span class="nav-text-mobile">報告</span>
      </a>
      <a href="{{ base }}/backtests">
        <span class="nav-text-desktop">回測結果</span>
        <span class="nav-text-mobile">回測</span>
      </a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
